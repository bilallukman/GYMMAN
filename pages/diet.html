<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GYMMAN — Diet Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/app.css">
</head><body data-page="diet"><aside id="appSidebar"></aside><div class="app-main"><main class="page-wrap">
<header class="page-topbar"><div><span class="eyebrow">NUTRITION</span><h1 class="page-title">Plan your nutrition.</h1><p class="page-subtitle">Keep your meals and daily water intake together so your training plan has a nutrition side too.</p></div></header>
<section class="form-layout"><article class="card form-card"><div class="section-head"><div><h2>Today's diet plan</h2><p>Update your meals and water intake.</p></div></div>
<div class="form-group"><label for="breakfast">Breakfast</label><input class="form-input" id="breakfast" placeholder="Oats, eggs and banana"></div>
<div class="form-group"><label for="lunch">Lunch</label><input class="form-input" id="lunch" placeholder="Rice, chicken and vegetables"></div>
<div class="form-group"><label for="dinner">Dinner</label><input class="form-input" id="dinner" placeholder="Chicken, rice and salad"></div>
<div class="form-group"><label for="water">Water intake (litres)</label><input class="form-input" type="number" id="water" min="0" step="0.1" placeholder="2.5"></div>
<button class="btn btn-primary" id="saveDiet">Save diet plan</button></article>
<article class="card form-card"><span class="eyebrow">SAVED PLAN</span><div id="result" class="detail-list"><div class="detail-row"><span>Breakfast</span><strong id="breakfastResult">—</strong></div><div class="detail-row"><span>Lunch</span><strong id="lunchResult">—</strong></div><div class="detail-row"><span>Dinner</span><strong id="dinnerResult">—</strong></div><div class="detail-row"><span>Water</span><strong id="waterResult">—</strong></div></div></article></section>
</main></div><script src="../js/app-shell.js"></script><script src="../js/diet.js"></script></body></html>
