<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GYMMAN — BMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/app.css">
</head><body data-page="bmi"><aside id="appSidebar"></aside><div class="app-main"><main class="page-wrap">
<header class="page-topbar"><div><span class="eyebrow">HEALTH METRIC</span><h1 class="page-title">Understand your BMI.</h1><p class="page-subtitle">Save a current height and weight reading and keep your latest BMI available in your GYMMAN profile.</p></div></header>
<section class="form-layout"><article class="card form-card"><div class="section-head"><div><h2>Calculate BMI</h2><p>Use your current measurements.</p></div></div>
<div class="form-group"><label for="height">Height (cm)</label><input class="form-input" type="number" id="height" min="1" placeholder="e.g. 180"></div>
<div class="form-group"><label for="weight">Weight (kg)</label><input class="form-input" type="number" id="weight" min="1" placeholder="e.g. 72"></div>
<button class="btn btn-primary" id="calculateBtn">Calculate BMI</button>
</article><article class="card form-card"><span class="eyebrow">LATEST RESULT</span><div id="result" class="empty-state"><h3>Your BMI will appear here</h3><p>Enter your measurements and calculate a new reading.</p></div></article></section>
</main></div><script src="../js/app-shell.js"></script><script src="../js/bmi.js"></script></body></html>
