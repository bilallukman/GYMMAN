<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYMMAN — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<a href="login.html" class="back-link">← Back to login</a>
<main class="auth-layout">
<section class="auth-brand"><a href="../index.html">GYMMAN</a><span>ACCOUNT SECURITY</span><h1>Create a new password.</h1><p>Choose a password with at least 6 characters.</p></section>
<section class="auth-card"><span class="auth-eyebrow">NEW PASSWORD</span><h2>Reset your password</h2><p class="auth-muted">Your reset link is temporary and can only be used once.</p>
<form id="resetForm" class="auth-form">
<div class="password-wrapper">
<input type="password" id="password" placeholder="New password (6+ characters)" required minlength="6" autocomplete="new-password">
<button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<p id="passwordHint" class="password-hint">At least 6 characters</p>
<div class="password-wrapper">
<input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6" autocomplete="new-password">
<button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false" title="Show password"><svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<button type="submit">Update password</button>
<p id="resetMessage" class="error"></p>
</form>
</section></main>
<script src="../js/password-recovery.js"></script>
</body></html>
