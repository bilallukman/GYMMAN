<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYMMAN — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
<a href="login.html" class="back-link">← Back to login</a>
<main class="auth-layout">
<section class="auth-brand"><a href="../index.html">GYMMAN</a><span>ACCOUNT SECURITY</span><h1>Create a new password.</h1><p>Choose a strong password you don't reuse on other services.</p></section>
<section class="auth-card"><span class="auth-eyebrow">NEW PASSWORD</span><h2>Reset your password</h2><p class="auth-muted">Your reset link is temporary and can only be used once.</p>
<form id="resetForm" class="auth-form">
<input type="password" id="password" placeholder="New password" required autocomplete="new-password">
<p id="passwordHint" class="password-hint">8+ chars • uppercase • lowercase • number • special character</p>
<input type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password">
<button type="submit">Update password</button>
<p id="resetMessage" class="error"></p>
</form>
</section></main>
<script src="../js/password-recovery.js"></script>
</body></html>
